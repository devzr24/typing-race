name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Un nouveau push annule l'exécution précédente sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: typing_race
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d typing_race"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base jetable du service ci-dessus ; secret de test sans valeur en production.
      DATABASE_URL: postgresql://test:test@localhost:5432/typing_race?schema=public
      AUTH_SECRET: secret-ci-uniquement-pour-les-tests-e2e-0123456789
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      - name: Client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrations (base de test)
        run: npx prisma migrate deploy

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
