# Base PostgreSQL locale pour le développement (voir README, « Lancer en local »).
# DATABASE_URL="postgresql://dev:dev@localhost:5432/typing_race?schema=public"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: typing_race
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d typing_race"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
